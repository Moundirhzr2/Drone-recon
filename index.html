<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone Recon — Mulhouse</title>
    <script>
      // Redondance volontaire avec le `define` de vite.config.ts : ceinture et bretelles.
      window.CESIUM_BASE_URL = '/cesiumStatic';
    </script>
    <link rel="stylesheet" href="/src/hud/hud.css" />
  </head>
  <body>
    <!-- Vue principale : la scene Cesium -->
    <div id="cesium"></div>
    <!-- Overlay de diagnostic dessine par-dessus la vue principale -->
    <canvas id="overlay-main"></canvas>

    <!-- Télémétrie : haut gauche. Le détail s'ouvre d'un clic sur l'en-tête. -->
    <section id="hud-gps" class="panel">
      <header id="gps-header" title="More telemetry">
        <span class="dot" id="gps-fix"></span> TELEMETRY
        <span class="spacer"></span>
        <span id="gps-mode" class="tag">MANUAL</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </header>
      <div class="inst">
        <div><span class="k">ALTITUDE</span><b data-v="agl">—</b><span class="u">m</span></div>
        <div><span class="k">SPEED</span><b data-v="spd">—</b><span class="u">m/s</span></div>
      </div>
      <div class="nav">
        <svg viewBox="-60 -60 120 120" id="compass-svg" aria-hidden="true">
          <circle cx="0" cy="0" r="52" class="c-ring" />
          <g id="compass-rose">
            <text x="0" y="-36" class="c-card">N</text>
            <text x="40" y="5" class="c-card">E</text>
            <text x="0" y="46" class="c-card">S</text>
            <text x="-40" y="5" class="c-card">W</text>
            <line x1="0" y1="-52" x2="0" y2="-44" class="c-tick" />
          </g>
          <polygon points="0,-30 7,10 0,3 -7,10" class="c-needle" />
        </svg>
        <div>
          <span class="k">HEADING</span><b class="acc"><span id="compass-deg">000</span>°</b>
        </div>
        <div>
          <span class="k">BATTERY</span><b data-v="bat">—</b>
          <span class="bar"><i id="gps-battery"></i></span>
        </div>
      </div>
      <div class="gps-alert" id="gps-alert" hidden></div>
      <div class="rows" id="gps-rows" hidden></div>
      <footer>
        <span data-v="pos">—</span><span>HOME <b data-v="home">—</b> m</span>
      </footer>
    </section>

    <!-- Vue nadir : haut droite -->
    <section id="hud-nadir" class="panel">
      <header>
        <span class="dot live"></span> NADIR CAMERA
        <span class="spacer"></span>
        <span id="nadir-mode" class="tag">RAW</span>
        <button
          id="nadir-pov"
          class="ico-btn"
          type="button"
          title="Full-screen view, from the drone (T)"
          aria-label="Full-screen view, from the drone (T)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
          </svg>
        </button>
      </header>
      <div class="nadir-stack">
        <canvas id="nadir-canvas" width="340" height="340"></canvas>
        <canvas id="nadir-overlay" width="340" height="340"></canvas>
        <div class="reticle"></div>
        <div class="nadir-foot"><span id="nadir-footprint">—</span></div>
      </div>
    </section>

    <!-- Planche avant / après en vue nadir : voir capturePair dans src/main.ts -->
    <div id="pair-preview" hidden>
      <figure>
        <div id="pair-preview-images"></div>
        <figcaption>
          <span id="pair-preview-caption"></span>
          <button id="pair-preview-close" type="button">Close <kbd>ESC</kbd></button>
        </figcaption>
      </figure>
    </div>

    <!-- Pilotage : bas gauche. Sans les mains, une simple pastille. -->
    <section id="hud-hands" class="panel off">
      <header>
        <span class="dot" id="hands-dot"></span> PILOTING
        <span class="spacer"></span>
        <span id="hands-source" class="tag">KEYBOARD</span>
      </header>
      <div class="cam-stack">
        <video id="webcam" playsinline muted></video>
        <canvas id="hands-canvas" width="480" height="360"></canvas>
      </div>
      <div class="sticks">
        <div class="stick" data-label="L"><div class="knob" id="stick-l"></div></div>
        <div class="stick" data-label="R"><div class="knob" id="stick-r"></div></div>
      </div>
      <div class="hands-msg" id="hands-msg"></div>
      <button id="hands-pill" class="hands-pill" type="button" title="Fly with your hands (H)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 11V6a2 2 0 0 0-4 0" />
          <path d="M14 10V4a2 2 0 0 0-4 0v2" />
          <path d="M10 10.5V6a2 2 0 0 0-4 0v8" />
          <path
            d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"
          />
        </svg>
        Hand control off<kbd>H</kbd>
      </button>
    </section>

    <!-- Rapport de diagnostic : bas droite, seulement avec V ou O -->
    <section id="hud-report" class="panel collapsed" hidden>
      <header id="report-header">
        <span class="dot warn"></span> DIAGNOSTIC
        <span class="spacer"></span>
        <span id="report-count" class="tag">0</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </header>
      <div class="report-body" id="report-body"></div>
    </section>

    <!-- Simulateur de desastres : partie 2 -->
    <section id="hud-disaster" class="panel collapsed">
      <header id="disaster-header">
        <span class="dot" id="disaster-dot"></span>
        <span class="title" id="disaster-title">SIMULATOR</span>
        <span class="spacer"></span>
        <span id="disaster-tag" class="tag">IDLE</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </header>
      <div class="disaster-body">
        <div class="dis-kinds" id="dis-kinds"></div>
        <p class="dis-blurb" id="dis-blurb"></p>

        <label class="dis-field">
          <span id="dis-mag-label">Intensity</span>
          <input type="range" id="dis-mag" min="5" max="10" step="0.5" value="8.5" />
          <b id="dis-mag-value">8.5</b>
        </label>

        <label class="dis-field" id="dis-wind-field">
          <span>Wind from</span>
          <input type="range" id="dis-wind" min="0" max="350" step="10" value="225" />
          <b id="dis-wind-value">225&deg;</b>
        </label>

        <div class="dis-transport">
          <button id="dis-play" class="dis-btn wide">Start</button>
          <button id="dis-start" class="dis-btn" title="Back to before the disaster">Before</button>
          <button id="dis-end" class="dis-btn" title="Jump to the final state">After</button>
          <button id="dis-reset" class="dis-btn" title="Cancel the disaster">Cancel</button>
        </div>

        <input
          type="range"
          id="dis-scrub"
          class="dis-scrub"
          min="0"
          max="1000"
          step="1"
          value="0"
        />
        <div class="dis-clock"><span id="dis-time">0.0 s</span><span id="dis-of">/ 0 s</span></div>

        <div class="dis-tally" id="dis-tally"></div>
        <div class="dis-note" id="dis-note">Choose a hazard, then Start.</div>

        <!-- Dégâts posés à la main : voir src/hud/editor.ts -->
        <div class="dis-section">
          <div class="dis-section-head">
            <span>MANUAL DAMAGE</span>
            <button id="dis-edit-toggle" class="dis-btn" type="button">Select (E)</button>
          </div>
          <p class="dis-edit-sel" id="dis-edit-sel"></p>
          <div class="dis-edit-states" id="dis-edit-states"></div>
        </div>

        <!-- Scénario en JSON : voir src/disaster/scenarioFile.ts -->
        <div class="dis-section">
          <div class="dis-section-head"><span>SCENARIO</span></div>
          <div class="dis-file">
            <input
              id="dis-file-name"
              type="text"
              maxlength="80"
              placeholder="Scenario name"
              aria-label="Scenario name"
            />
            <button id="dis-save" class="dis-btn" type="button">Save</button>
            <button id="dis-load" class="dis-btn" type="button">Load</button>
          </div>
          <button id="dis-pair" class="dis-btn dis-pair" type="button">
            Capture before / after (Shift + Space)
          </button>
        </div>
      </div>
    </section>

    <!-- Galerie de photos : elle apparaît à la première -->
    <section id="hud-gallery" class="panel"><div id="gallery-strip"></div></section>

    <!-- Raccourcis du vol, sur une ligne ; toutes les touches avec « ? » -->
    <footer id="keymap" class="panel"></footer>
    <div id="keys-help" hidden></div>

    <!-- Messages passagers : au-dessus des raccourcis -->
    <div id="toast" class="panel" role="status" aria-live="polite"></div>

    <!-- Masquer l'interface : seul ce bouton reste affiche -->
    <button id="hud-toggle" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
        <circle cx="12" cy="12" r="3" />
        <line class="slash" x1="3" y1="3" x2="21" y2="21" />
      </svg>
    </button>

    <!-- Qualite d'image : la retablir et la fixer -->
    <button id="quality-toggle" type="button">HD</button>

    <!-- Lieu du vol : voir src/hud/placePicker.ts -->
    <button id="place-toggle" type="button">Mulhouse — centre</button>
    <section id="place-panel" class="panel" hidden>
      <input
        id="place-query"
        type="text"
        maxlength="120"
        autocomplete="off"
        placeholder="City, address, or 48.58, 7.75"
        aria-label="Flight location"
      />
      <div id="place-results"></div>
      <p id="place-note" class="place-note"></p>
      <button id="place-home" class="dis-btn" type="button" hidden>Back to Mulhouse</button>
    </section>

    <!-- Flash de prise de vue -->
    <div id="shutter"></div>

    <!-- Ecran de chargement -->
    <div id="boot">
      <div class="boot-inner">
        <h1>DRONE RECON</h1>
        <p id="boot-msg">Starting…</p>
        <div class="boot-bar"><i id="boot-bar"></i></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
